[pytest]
# `--ds` en addopts, no solo la clave de abajo: la variable de entorno
# DJANGO_SETTINGS_MODULE le gana al .ini, y los contenedores la exportan con
# `pycore.settings.development`. Las pruebas corrían entonces con settings de
# desarrollo, donde CELERY_TASK_ALWAYS_EAGER no está puesto: cada evento de
# dominio que emitía un test se encolaba en el Redis REAL y lo ejecutaba el
# worker de verdad contra la base de desarrollo — escribiendo en Logs_Auditoria
# y fallando con "Empresa matching query does not exist", porque la empresa solo
# existía en la base de pruebas. Los handlers nunca corrían donde el test podía
# verlos, así que once pruebas de stock fallaban sin motivo aparente.
# `--ds` tiene prioridad sobre la variable de entorno.
DJANGO_SETTINGS_MODULE = pycore.settings.testing
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = --ds=pycore.settings.testing --cov=apps --cov-report=term-missing --cov-report=html
